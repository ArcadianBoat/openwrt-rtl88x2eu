
name: Build RTL8812EU for OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential \
            clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget

      - name: Download OpenWrt SDK
        run: |
          wget -O sdk.tar.zst \
            https://downloads.openwrt.org/releases/25.12.0/targets/sunxi/cortexa7/openwrt-sdk-25.12.0-sunxi-cortexa7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Get driver source
        run: |
          mkdir -p sdk/package/rtl88x2eu
          cp package/rtl88x2eu/Makefile sdk/package/rtl88x2eu/
          git clone --depth 1 --branch stock_2026_driver \
            https://github.com/OpenHD/rtl88x2eu.git \
            sdk/package/rtl88x2eu/src

      - name: Configure SDK
        working-directory: sdk
        env:
          TERM: xterm
        run: |
          make defconfig

      - name: Compile package
        working-directory: sdk
        env:
          TERM: xterm
        run: |
          make package/rtl88x2eu/compile V=s

      - name: Collect package
        run: |
          mkdir -p artifacts
          find sdk/bin/packages -type f \
            -name 'kmod-rtl88x2eu*.apk' \
            -exec cp {} artifacts/ \;
          find artifacts -type f -print
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rtl88x2eu-openwrt-25.12.0
          path: artifacts/*.apk
          if-no-files-found: error
